name: Publicar UNIMAX

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-unimax-roadmap.yml'

permissions:
  contents: write

concurrency:
  group: max-simulator-publish
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sincronizar versão atual
        run: git pull --rebase origin main
      - name: Instalar motor isolado do simulador
        run: python scripts/fix_simulator_clicks.py
      - name: Publicar correção
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Isola motor funcional do simulador MAX 2027"
            git pull --rebase origin main
            git push origin main
          fi

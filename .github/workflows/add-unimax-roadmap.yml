name: Publicar UNIMAX

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-unimax-roadmap.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_simulator_clicks.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Corrige interação dos cards do simulador MAX 2027"
          git push

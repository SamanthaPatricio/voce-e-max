name: Atualizar experiencia MAX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-solides-pricing.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar UNIMAX e simulador 2027
        run: python scripts/add_unimax.py
      - name: Publicar alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Adiciona UNIMAX e simulador interativo RH 2027"
          git push

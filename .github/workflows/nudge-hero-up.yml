name: Nudge hero text up
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nudge-hero-up.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move only the animated headline up
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='id="hero-nudge-only"'
          if marker not in s:
              css='''<style id="hero-nudge-only">\n.animatedClaim{transform:translateY(-18px)!important;}\n</style>'''
              s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move hero headline slightly up" && git push

name: Fit hero headline
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fit-hero-text.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust only headline size and box
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='id="hero-fit-only"'
          if marker not in s:
              css='''<style id="hero-fit-only">\n.animatedClaim{height:clamp(5.4rem,7.5vw,7rem)!important;transform:translateY(-12px)!important;overflow:hidden!important;}\n.animatedClaim span{font-size:clamp(2.45rem,4.6vw,4.85rem)!important;line-height:1.08!important;}\n</style>'''
              s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fit hero headline without clipping" && git push
